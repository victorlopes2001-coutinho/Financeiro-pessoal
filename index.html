            if (v === null || v === undefined) return NaN;
            let s = String(v).trim();
            if (s === '') return NaN;
            if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');

            if (!dataString) return '';

        const rotuloDia = (dataString) => {
            if (!dataString) return { titulo: 'Sem data', sub: '' };
            const [a, m, d] = dataString.split('-').map(Number);
            const dt = new Date(a, m - 1, d);
            const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
            const dif = Math.round((hoje - dt) / 86400000);
            const sem = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'][dt.getDay()];
            const mesAbr = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][m - 1];
            const sub = `${String(d).padStart(2, '0')} ${mesAbr}`;
            if (dif === 0) return { titulo: 'Hoje', sub };
            if (dif === 1) return { titulo: 'Ontem', sub };
            if (dif === -1) return { titulo: 'Amanhã', sub };
            return { titulo: sem, sub };

            if (PALETA_CATEGORIAS[cat]) return PALETA_CATEGORIAS[cat];
            let h = 0;
            for (let i = 0; i < (cat || '').length; i++) h = (h * 31 + cat.charCodeAt(i)) % PALETA_EXTRA.length;

            let h = 0;
            const n = (nome || '').toLowerCase();
            for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % PALETA_CONTAS.length;

        const polarToCartesian = (cx, cy, r, anguloGraus) => {
            const a = (anguloGraus - 90) * Math.PI / 180;
            return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
        };
        const describeArc = (cx, cy, r, anguloInicio, anguloFim) => {
            const inicio = polarToCartesian(cx, cy, r, anguloFim);
            const fim = polarToCartesian(cx, cy, r, anguloInicio);
            const largeArc = anguloFim - anguloInicio <= 180 ? '0' : '1';
            return ['M', inicio.x, inicio.y, 'A', r, r, 0, largeArc, 0, fim.x, fim.y].join(' ');
        };
        const escurecer = (hex, pct) => {
            try {
                const n = parseInt(hex.replace('#', ''), 16);
                let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
                r = Math.max(0, Math.round(r * (1 - pct / 100)));
                g = Math.max(0, Math.round(g * (1 - pct / 100)));
                b = Math.max(0, Math.round(b * (1 - pct / 100)));
                return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
            } catch (e) { return hex; }

                await db.collection(prefixo() + 'orcamentos').doc(slugInv(categoria)).set({ categoria, limite, atualizadoEm: new Date().toISOString() });
                setEditandoOrc(null);
                setFormOrc({ categoria: '', valor: '' });
            };
            const removerOrcamento = async (o) => {
                if (!confirm(`Remover o limite de ${o.categoria}?`)) return;
                await db.collection(prefixo() + 'orcamentos').doc(o.id).delete();
                setEditandoOrc(null);
            };

            const renderLinhaTransacao = (t) => (
                <div key={t.id} className={editandoTransacao === t.id ? `p-3 my-2 rounded-xl border-2 ${darkMode ? 'border-gray-600' : 'border-gray-200'}` : `relative border-b last:border-b-0 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                    {editandoTransacao === t.id ? (
                        <div className="space-y-2">
                            <input type="text" placeholder="Descrição" value={formEdicao.descricao} onChange={(e) => setFormEdicao({...formEdicao, descricao: e.target.value})}
                                className={`w-full px-2 py-1 rounded border ${inputClass}`} />
                            <div className="grid grid-cols-2 gap-2">
                                <input type="text" inputMode="decimal" placeholder="Valor" value={formEdicao.valor} onChange={(e) => setFormEdicao({...formEdicao, valor: e.target.value})}
                                    className={`px-2 py-1 rounded border ${inputClass}`} />
                                <input type="date" value={formEdicao.data || ''} onChange={(e) => setFormEdicao({...formEdicao, data: e.target.value})}
                                    className={`px-2 py-1 rounded border ${inputClass}`} />
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setFormEdicao({...formEdicao, tipo: 'despesa'})}
                                    className={`flex-1 py-1 rounded text-sm font-bold border-2 ${formEdicao.tipo === 'despesa' ? 'bg-red-600 text-white border-red-600' : inputClass}`}>Despesa</button>
                                <button onClick={() => setFormEdicao({...formEdicao, tipo: 'receita'})}
                                    className={`flex-1 py-1 rounded text-sm font-bold border-2 ${formEdicao.tipo === 'receita' ? 'bg-green-600 text-white border-green-600' : inputClass}`}>Receita</button>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <select value={formEdicao.categoria || 'Outros'} onChange={(e) => setFormEdicao({...formEdicao, categoria: e.target.value})}
                                    className={`px-2 py-1 rounded border ${inputClass}`}>
                                    {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <select value={formEdicao.contaId || ''} onChange={(e) => setFormEdicao({...formEdicao, contaId: e.target.value || null})}
                                    className={`px-2 py-1 rounded border ${inputClass}`}>
                                    <option value="">Sem conta</option>
                                    {contas.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                                </select>
                            </div>
                            {t.pago && (
                                <p className="text-xs text-gray-500">Este lançamento está pago — alterar valor, tipo ou conta ajusta o saldo automaticamente.</p>
                            )}
                            <div className="flex gap-2">
                                <button onClick={() => executar(() => salvarEdicao(t))} disabled={salvando} className="px-3 py-1 bg-green-600 text-white rounded text-sm disabled:opacity-60">Salvar</button>
                                <button onClick={() => setEditandoTransacao(null)} className="px-3 py-1 bg-gray-300 rounded text-sm">Cancelar</button>
                            </div>
                        </div>
                    ) : (
                        <div>
                            {(() => {
                                const atrasada = !t.pago && (t.data || '') < getDataHoje();
                                const despesaPaga = t.pago && t.tipo === 'despesa';
                                const muted = darkMode ? 'text-gray-400' : 'text-gray-500';
                                return (
                            <div onClick={() => setTransacaoAberta(transacaoAberta === t.id ? null : t.id)} className="flex items-center gap-3 py-2.5 cursor-pointer">
                                {!t.pago && (
                                    <span className={`absolute -left-4 top-1.5 bottom-1.5 w-1 rounded-r ${atrasada ? 'bg-red-600' : 'bg-orange-500'}`}></span>
                                )}
                                <div className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0 ${despesaPaga ? 'opacity-50' : ''}`}
                                    style={{ backgroundColor: corCategoria(t.categoria) + '26', color: corCategoria(t.categoria) }}>
                                    {(t.categoria || '?').charAt(0).toUpperCase()}
                                </div>
                                <div className="flex-1 min-w-0">
                                    <p className={`font-medium truncate ${despesaPaga ? muted : ''}`}>{t.descricao} {t.serieId && <span title="Repete em outros meses" className="text-xs">🔁</span>}</p>
                                    <p className={`text-xs truncate ${muted}`}>{t.categoria}</p>
                                </div>
                                <div className="text-right flex-shrink-0">
                                    <p className={`whitespace-nowrap ${despesaPaga ? `font-medium ${muted}` : `font-bold ${t.tipo === 'receita' ? 'text-green-600' : 'text-red-600'}`}`}>
                                        {t.tipo === 'receita' ? '+' : '−'} {formatarMoeda(t.valor)}
                                    </p>
                                    {t.pago ? (
                                        <button onClick={(e) => { e.stopPropagation(); executar(() => abrirModalBaixa(t)); }} disabled={salvando}
                                            className={`text-xs font-medium ${muted}`}>✓ {t.tipo === 'receita' ? 'recebido' : 'pago'}</button>
                                    ) : atrasada ? (
                                        <button onClick={(e) => { e.stopPropagation(); executar(() => abrirModalBaixa(t)); }} disabled={salvando}
                                            className={`text-xs font-bold px-2 py-0.5 rounded-full mt-0.5 ${darkMode ? 'bg-red-900 bg-opacity-70 text-red-200' : 'bg-red-100 text-red-800'}`}>⚠ Atrasado</button>
                                    ) : (
                                        <button onClick={(e) => { e.stopPropagation(); executar(() => abrirModalBaixa(t)); }} disabled={salvando}
                                            className={`text-xs font-bold px-2 py-0.5 rounded-full mt-0.5 ${darkMode ? 'bg-orange-900 bg-opacity-70 text-orange-200' : 'bg-orange-100 text-orange-800'}`}>⏱ {t.tipo === 'receita' ? 'A receber' : 'Pendente'}</button>
                                    )}
                                </div>
                            </div>
                                );
                            })()}
                            {transacaoAberta === t.id && (
                                <div className="flex gap-2 pb-3 pl-12">
                                    <span className={`text-xs self-center flex-1 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{formatarData(t.data)}{t.contaId && contas.find(c => c.id === t.contaId) ? ` · ${contas.find(c => c.id === t.contaId).nome}` : ''}</span>
                                    <button onClick={() => { setTransacaoAberta(null); iniciarEdicao(t); }} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${darkMode ? 'bg-gray-700 text-blue-300' : 'bg-blue-50 text-blue-600'}`}>✏️ Editar</button>
                                    <button onClick={() => { setTransacaoAberta(null); excluirTransacao(t.id); }} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${darkMode ? 'bg-gray-700 text-red-300' : 'bg-red-50 text-red-600'}`}>🗑️ Excluir</button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );

            const chipFinAtivo = filtroFinanceiro === 'pendentes' && filtroTipo === 'todos' ? 'pendentes'
                : filtroFinanceiro === 'todas' ? (filtroTipo === 'todos' ? 'todas' : filtroTipo) : null;
            const aplicarChipFin = (k) => {
                if (k === 'pendentes') { setFiltroTipo('todos'); setFiltroFinanceiro('pendentes'); }
                else { setFiltroTipo(k === 'todas' ? 'todos' : k); setFiltroFinanceiro('todas'); }
            };
            const abrirNovaTransacao = () => {
                setFormTransacao(f => ({ ...f, data: f.descricao || f.valor ? f.data : getDataHoje() }));
                setMostrarNovaTransacao(true);
            };

            const renderListaPorDia = (lista) => {
                const dias = [];
                lista.forEach(t => {
                    const ult = dias[dias.length - 1];
                    if (ult && ult.data === t.data) ult.itens.push(t); else dias.push({ data: t.data, itens: [t] });
                });
                return dias.map(dia => {
                    const tot = dia.itens.reduce((s, t) => s + (t.tipo === 'receita' ? t.valor : -t.valor), 0);
                    const r = rotuloDia(dia.data);
                    return (
                        <div key={dia.data || 'sem-data'}>
                            <div className={`flex justify-between items-baseline pt-4 pb-1 text-xs border-b ${darkMode ? 'border-gray-700 text-gray-400' : 'border-gray-200 text-gray-500'}`}>
                                <span><span className={`font-bold text-sm ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{r.titulo}</span>{r.sub && ` · ${r.sub}`}</span>
                                <span className="font-medium">{tot >= 0 ? '+' : '−'} {formatarMoeda(Math.abs(tot))}</span>
                            </div>
                            {dia.itens.map(t => renderLinhaTransacao(t))}
                        </div>
                    );
                });
            };

            // Funções CRUD
            const prefixo = () => `${usuarioAtual}_`;

            const adicionarTransacao = async () => {
                if (!formTransacao.descricao || !formTransacao.valor) return alert('Preencha descrição e valor');
                const valor = parseValor(formTransacao.valor);
                if (isNaN(valor)) return alert('Valor inválido');

                const repetir = formTransacao.repetir;
                const numMeses = repetir ? Math.max(2, parseInt(formTransacao.numMeses) || 2) : 1;
                const serieId = repetir ? (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)) : null;

                const base = {
                    tipo: formTransacao.tipo,
                    descricao: formTransacao.descricao,
                    valor,
                    categoria: formTransacao.categoria || 'Outros',
                    contaId: formTransacao.contaId,
                };

                // Atualiza o saldo apenas da 1ª (se marcada como paga). As futuras entram como pendentes.
                if (formTransacao.pago && formTransacao.contaId) {
                    const conta = contas.find(c => c.id === formTransacao.contaId);
                    if (conta) {
                        const delta = formTransacao.tipo === 'receita' ? valor : -valor;
                        await db.collection(prefixo() + 'contas').doc(formTransacao.contaId).update({ saldo: inc(delta) });
                    }
                }

                const batch = db.batch();
                for (let i = 0; i < numMeses; i++) {
                    const ref = db.collection(prefixo() + 'transacoes').doc();
                    batch.set(ref, {
                        ...base,
                        data: i === 0 ? formTransacao.data : addMeses(formTransacao.data, i),
                        pago: i === 0 ? formTransacao.pago : false,
                        serieId,
                        criadoEm: new Date().toISOString()
                    });
                }
                await batch.commit();

                setFormTransacao({ tipo: 'despesa', descricao: '', valor: '', categoria: '', data: getDataHoje(), pago: false, contaId: formTransacao.contaId, repetir: false, numMeses: 12 });
                return true;
            };

            const excluirTransacao = async (id) => {
                const t = transacoes.find(t => t.id === id);
                if (!t) return;
                if (!confirm('Excluir esta transação?')) return;

                let alvos = [t];
                // Se faz parte de uma série recorrente, oferece excluir também as futuras
                if (t.serieId) {
                    const futuras = transacoes.filter(x => x.serieId === t.serieId && x.data >= t.data && x.id !== t.id);
                    if (futuras.length > 0 && confirm(`Essa transação se repete em outros meses (${futuras.length} futura(s)).\n\nOK = excluir esta E as próximas\nCancelar = excluir só esta`)) {
                        alvos = alvos.concat(futuras);
                    }
                }

                // Reverte o saldo das que estavam pagas (somando por conta para não sobrescrever)
                const deltas = {};
                alvos.forEach(alvo => {
                    if (alvo.pago && alvo.contaId) {
                        const d = alvo.tipo === 'receita' ? -alvo.valor : alvo.valor;
                        deltas[alvo.contaId] = (deltas[alvo.contaId] || 0) + d;
                    }
                });

                const batch = db.batch();
                Object.entries(deltas).forEach(([cId, delta]) => {
                    const conta = contas.find(c => c.id === cId);
                    if (conta) batch.update(db.collection(prefixo() + 'contas').doc(cId), { saldo: inc(delta) });
                });
                alvos.forEach(alvo => batch.delete(db.collection(prefixo() + 'transacoes').doc(alvo.id)));
                await batch.commit();
            };

            const abrirModalBaixa = (t) => {
                if (t.pago) {
                    return confirmarBaixa(t, t.contaId, true);
                } else {
                    setDandoBaixa(t);
                    setContaBaixa(t.contaId || (contas.length > 0 ? contas[0].id : null));
                }
            };

            const confirmarBaixa = async (t, contaId, estaDesmarcando = false) => {
                const novoPago = !t.pago;
                
                if (contaId) {
                    const conta = contas.find(c => c.id === contaId);
                    if (conta) {
                        let delta;
                        if (novoPago) {
                            delta = t.tipo === 'receita' ? t.valor : -t.valor;
                        } else {
                            delta = t.tipo === 'receita' ? -t.valor : t.valor;
                        }
                        await db.collection(prefixo() + 'contas').doc(contaId).update({ saldo: inc(delta) });
                    }
                }
                
                await db.collection(prefixo() + 'transacoes').doc(t.id).update({ pago: novoPago, contaId: contaId || null });
                setDandoBaixa(null);
                setContaBaixa(null);
            };

            const iniciarEdicao = (t) => {
                setEditandoTransacao(t.id);
                setFormEdicao({ descricao: t.descricao, valor: t.valor.toString(), categoria: t.categoria, data: t.data, tipo: t.tipo, contaId: t.contaId });
            };

            const salvarEdicao = async (t) => {
                if (!formEdicao.descricao || !formEdicao.valor) return alert('Preencha descrição e valor');
                const novoValor = parseValor(formEdicao.valor);
                if (isNaN(novoValor) || novoValor < 0) return alert('Valor inválido');
                const novoTipo = formEdicao.tipo || t.tipo;
                const novaConta = formEdicao.contaId || null;

                const batch = db.batch();

                // Se a transação está paga, reverte o efeito antigo e aplica o novo no saldo.
                // Isso cobre mudança de valor, de tipo (receita/despesa) e de conta.
                if (t.pago) {
                    const deltas = {};
                    if (t.contaId) {
                        const dOld = t.tipo === 'receita' ? -t.valor : t.valor; // desfaz o efeito antigo
                        deltas[t.contaId] = (deltas[t.contaId] || 0) + dOld;
                    }
                    if (novaConta) {
                        const dNew = novoTipo === 'receita' ? novoValor : -novoValor; // aplica o novo efeito
                        deltas[novaConta] = (deltas[novaConta] || 0) + dNew;
                    }
                    Object.entries(deltas).forEach(([cId, delta]) => {
                        const conta = contas.find(c => c.id === cId);
                        if (conta) batch.update(db.collection(prefixo() + 'contas').doc(cId), { saldo: inc(delta) });
                    });
                }

                batch.update(db.collection(prefixo() + 'transacoes').doc(t.id), {
                    descricao: formEdicao.descricao,
                    valor: novoValor,
                    categoria: formEdicao.categoria || t.categoria || 'Outros',
                    data: formEdicao.data || t.data,
                    tipo: novoTipo,
                    contaId: novaConta
                });
                await batch.commit();
                setEditandoTransacao(null);
                setFormEdicao({});
            };

            // Contas
            const adicionarConta = async () => {
                if (!formConta.nome || !formConta.saldoInicial) return alert('Preencha os campos');
                await db.collection(prefixo() + 'contas').add({ nome: formConta.nome, saldo: parseValor(formConta.saldoInicial), tipo: formConta.tipo, criadoEm: new Date().toISOString() });
                setFormConta({ nome: '', saldoInicial: '', tipo: 'corrente' });
                setMostrarFormConta(false);
            };

            const excluirConta = async (id) => {
                if (confirm('Excluir esta conta?')) await db.collection(prefixo() + 'contas').doc(id).delete();
            };

            const editarSaldoConta = async (id, novoSaldo) => {
                await db.collection(prefixo() + 'contas').doc(id).update({ saldo: parseValor(novoSaldo) });
                setEditandoConta(null);
                setNovoSaldoConta('');
            };

            const transferirEntreContas = async () => {
                const { origemId, destinoId, valor } = formTransferencia;
                if (!origemId || !destinoId) return alert('Selecione a conta de origem e a de destino');
                if (origemId === destinoId) return alert('Escolha contas diferentes');
                const v = parseValor(valor);
                if (!v || v <= 0) return alert('Informe um valor válido');
                const origem = contas.find(c => c.id === origemId);
                if (origem && origem.saldo < v && !confirm('O saldo da conta de origem ficará negativo. Continuar mesmo assim?')) return;
                const batch = db.batch();
                batch.update(db.collection(prefixo() + 'contas').doc(origemId), { saldo: inc(-v) });
                batch.update(db.collection(prefixo() + 'contas').doc(destinoId), { saldo: inc(v) });
                await batch.commit();
                setFormTransferencia({ origemId: '', destinoId: '', valor: '' });
                setMostrarTransferencia(false);
            };

            // Investimentos
            const adicionarInvestimento = async () => {
                if (!formInvestimento.descricao || !formInvestimento.valor) return alert('Preencha descrição e valor');
                if (!formInvestimento.contaId) return alert('Selecione uma conta');
                
                const valor = parseValor(formInvestimento.valor);
                const conta = contas.find(c => c.id === formInvestimento.contaId);
                
                if (conta) {
                    const delta = formInvestimento.tipo === 'aplicacao' ? -valor : valor;
                    await db.collection(prefixo() + 'contas').doc(formInvestimento.contaId).update({ saldo: inc(delta) });
                }
                
                await db.collection(prefixo() + 'investimentos').add({ ...formInvestimento, valor, criadoEm: new Date().toISOString() });
                setFormInvestimento({ tipo: 'aplicacao', descricao: '', valor: '', categoria: 'Renda Fixa', data: getDataHoje(), contaId: formInvestimento.contaId });
            };

            const excluirInvestimento = async (inv) => {
                if (!confirm('Excluir? O saldo será revertido.')) return;
                const conta = contas.find(c => c.id === inv.contaId);
                if (conta) {
                    const delta = inv.tipo === 'aplicacao' ? inv.valor : -inv.valor;
                    await db.collection(prefixo() + 'contas').doc(inv.contaId).update({ saldo: inc(delta) });
                }
                await db.collection(prefixo() + 'investimentos').doc(inv.id).delete();
            };

            const salvarValorAtualTipo = async (categoria, valorStr) => {
                const v = parseValor(valorStr);
                if (isNaN(v) || v < 0) return alert('Valor inválido');
                const slug = slugInv(categoria);
                await db.collection(prefixo() + 'investValores').doc(slug).set({ categoria, valorAtual: v, atualizadoEm: new Date().toISOString() }, { merge: true });
                setEditandoValorTipo(null);
                setValorTipoInput('');
            };

            // Parcelas
            const adicionarParcela = async () => {
                if (!formParcela.descricao || !formParcela.numParcelas || !formParcela.diaVencimento) {
                    return alert('Preencha descrição, nº de parcelas e dia de vencimento.');
                }

                const numParcelas = parseInt(formParcela.numParcelas);
                if (isNaN(numParcelas) || numParcelas < 1) return alert('Nº de parcelas inválido');
                const diaV = Math.min(31, Math.max(1, parseInt(formParcela.diaVencimento) || 1));

                let valorEntrada = null;
                let valorParcela;
                let valorTotal;
                if (formParcela.entradaDiferente) {
                    const vEnt = parseValor(formParcela.valorEntrada);
                    const vDem = parseValor(formParcela.valorDemais);
                    if (isNaN(vEnt) || isNaN(vDem) || vEnt < 0 || vDem < 0) return alert('Informe o valor da entrada e o valor das demais parcelas.');
                    if (numParcelas < 2) return alert('Para entrada diferente, use pelo menos 2 parcelas (entrada + 1).');
                    valorEntrada = Math.round(vEnt * 100) / 100;
                    valorParcela = Math.round(vDem * 100) / 100;
                    valorTotal = Math.round((valorEntrada + valorParcela * (numParcelas - 1)) * 100) / 100;
                } else {
                    valorTotal = parseValor(formParcela.valorTotal);
                    if (isNaN(valorTotal)) return alert('Informe o valor total.');
                    valorParcela = Math.round((valorTotal / numParcelas) * 100) / 100;
                }

                if (formParcela.lancarFinancas) {
                    // Cria uma transação por mês na lista de Finanças (não cria entidade de parcela)
                    const serieId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                    const hoje = new Date();
                    const diaClamp = (ano, mes) => Math.min(diaV, new Date(ano, mes + 1, 0).getDate());
                    let d = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
                    const dataDoMes = new Date(hoje.getFullYear(), hoje.getMonth(), diaClamp(hoje.getFullYear(), hoje.getMonth()));
                    if (dataDoMes < new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) {
                        d = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
                    }
                    const batch = db.batch();
                    for (let i = 0; i < numParcelas; i++) {
                        const ano = d.getFullYear(), mes = d.getMonth();
                        const dia = diaClamp(ano, mes);
                        const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                        const ref = db.collection(prefixo() + 'transacoes').doc();
                        batch.set(ref, {
                            tipo: formParcela.tipo,
                            descricao: `${formParcela.descricao} (${i + 1}/${numParcelas})`,
                            valor: (i === 0 && valorEntrada != null) ? valorEntrada : valorParcela,
                            categoria: formParcela.categoria || 'Outros',
                            data: dataStr,
                            pago: false,
                            contaId: formParcela.contaId,
                            serieId,
                            criadoEm: new Date().toISOString()
                        });
                        d = new Date(ano, mes + 1, 1);
                    }
                    await batch.commit();
                    // Também salva um registro de acompanhamento na aba Parcelas (ligado à série pelo serieId)
                    await db.collection(prefixo() + 'parcelas').add({
                        descricao: formParcela.descricao,
                        valorTotal,
                        numParcelas,
                        valorParcela,
                        valorEntrada,
                        parcelasPagas: 0,
                        diaVencimento: diaV,
                        categoria: formParcela.categoria || 'Outros',
                        contaId: formParcela.contaId,
                        tipo: formParcela.tipo,
                        serieId,
                        lancadoFinancas: true,
                        criadoEm: new Date().toISOString()
                    });
                } else {
                    // Cria a entidade de parcela (aba Parcelas), como antes
                    await db.collection(prefixo() + 'parcelas').add({
                        descricao: formParcela.descricao,
                        valorTotal,
                        numParcelas,
                        valorParcela,
                        valorEntrada,
                        parcelasPagas: 0,
                        diaVencimento: diaV,
                        categoria: formParcela.categoria || 'Outros',
                        contaId: formParcela.contaId,
                        criadoEm: new Date().toISOString()
                    });
                }

                setFormParcela({ descricao: '', valorTotal: '', numParcelas: '', diaVencimento: '', categoria: 'Outros', contaId: null, lancarFinancas: false, tipo: 'despesa', entradaDiferente: false, valorEntrada: '', valorDemais: '' });
                setMostrarFormParcela(false);
            };

            const pagarParcela = async (p) => {
                if (p.parcelasPagas >= p.numParcelas) return alert('Todas as parcelas já foram pagas!');
                const valor = valorProximaParcela(p);

                if (p.contaId) {
                    const conta = contas.find(c => c.id === p.contaId);
                    if (conta) {
                        await db.collection(prefixo() + 'contas').doc(p.contaId).update({ saldo: inc(-valor) });
                    }
                }

                await db.collection(prefixo() + 'parcelas').doc(p.id).update({ parcelasPagas: p.parcelasPagas + 1 });
            };

            const desfazerPagamentoParcela = async (p) => {
                if (!p.parcelasPagas || p.parcelasPagas <= 0) return alert('Não há parcela paga para desmarcar.');
                const valor = valorParcelaIdx(p, p.parcelasPagas - 1);

                if (p.contaId) {
                    const conta = contas.find(c => c.id === p.contaId);
                    if (conta) {
                        await db.collection(prefixo() + 'contas').doc(p.contaId).update({ saldo: inc(valor) });
                    }
                }

                await db.collection(prefixo() + 'parcelas').doc(p.id).update({ parcelasPagas: p.parcelasPagas - 1 });
            };

            const excluirParcela = async (p) => {
                const parc = typeof p === 'string' ? parcelas.find(x => x.id === p) : p;
                if (!parc) return;

                if (parc.lancadoFinancas) {
                    if (!confirm('Excluir esta compra parcelada?')) return;
                    const ligadas = transacoes.filter(t => t.serieId === parc.serieId);
                    const tambemFinancas = ligadas.length > 0 && confirm(
                        `Esta parcela também tem ${ligadas.length} lançamento(s) na aba Finanças.\n\nOK = excluir a parcela E os lançamentos em Finanças\nCancelar = excluir só a parcela (mantém os lançamentos em Finanças)`
                    );
                    const batch = db.batch();
                    if (tambemFinancas) {
                        const deltas = {};
                        ligadas.forEach(t => {
                            if (t.pago && t.contaId) {
                                const d = t.tipo === 'receita' ? -t.valor : t.valor;
                                deltas[t.contaId] = (deltas[t.contaId] || 0) + d;
                            }
                        });
                        Object.entries(deltas).forEach(([cId, delta]) => {
                            const conta = contas.find(c => c.id === cId);
                            if (conta) batch.update(db.collection(prefixo() + 'contas').doc(cId), { saldo: inc(delta) });
                        });
                        ligadas.forEach(t => batch.delete(db.collection(prefixo() + 'transacoes').doc(t.id)));
                    }
                    batch.delete(db.collection(prefixo() + 'parcelas').doc(parc.id));
                    await batch.commit();
                } else {
                    if (confirm('Excluir esta compra parcelada?')) await db.collection(prefixo() + 'parcelas').doc(parc.id).delete();
                }
            };

            const iniciarEdicaoParcela = (p) => {
                setEditandoParcela(p.id);
                setFormEdicaoParcela({
                    descricao: p.descricao,
                    valorTotal: (p.valorTotal != null ? p.valorTotal : (p.valorParcela * p.numParcelas)).toString(),
                    numParcelas: p.numParcelas.toString(),
                    diaVencimento: (p.diaVencimento || 1).toString(),
                    categoria: p.categoria || 'Outros',
                    contaId: p.contaId || null,
                    entradaDiferente: p.valorEntrada != null,
                    valorEntrada: (p.valorEntrada != null ? p.valorEntrada : '').toString(),
                    valorDemais: (p.valorParcela != null ? p.valorParcela : '').toString()
                });
                setMostrarFormParcela(false);
            };

            const cancelarEdicaoParcela = () => {
                setEditandoParcela(null);
                setFormEdicaoParcela({});
            };

            const salvarEdicaoParcela = async (p) => {
                const f = formEdicaoParcela;
                if (!f.descricao || !f.numParcelas || !f.diaVencimento) {
                    return alert('Preencha descrição, nº de parcelas e dia de vencimento.');
                }
                const numParcelas = parseInt(f.numParcelas);
                if (isNaN(numParcelas) || numParcelas < 1) return alert('Nº de parcelas inválido.');
                const diaV = Math.min(31, Math.max(1, parseInt(f.diaVencimento) || 1));
                const categoria = f.categoria || 'Outros';
                const contaId = f.contaId || null;

                let valorEntrada = null;
                let valorParcela;
                let valorTotal;
                if (f.entradaDiferente) {
                    const vEnt = parseValor(f.valorEntrada);
                    const vDem = parseValor(f.valorDemais);
                    if (isNaN(vEnt) || isNaN(vDem) || vEnt < 0 || vDem < 0) return alert('Informe o valor da entrada e o valor das demais parcelas.');
                    if (numParcelas < 2) return alert('Para entrada diferente, use pelo menos 2 parcelas (entrada + 1).');
                    valorEntrada = Math.round(vEnt * 100) / 100;
                    valorParcela = Math.round(vDem * 100) / 100;
                    valorTotal = Math.round((valorEntrada + valorParcela * (numParcelas - 1)) * 100) / 100;
                } else {
                    valorTotal = parseValor(f.valorTotal);
                    if (isNaN(valorTotal)) return alert('Informe o valor total.');
                    valorParcela = Math.round((valorTotal / numParcelas) * 100) / 100;
                }

                if (p.lancadoFinancas) {
                    // Parcela ligada ao Finanças: nº de parcelas travado (somar/remover lançamentos é arriscado)
                    if (numParcelas !== p.numParcelas) {
                        return alert('Esta parcela foi lançada em Finanças, então o nº de parcelas não muda por aqui. Para alterar a quantidade, exclua e crie de novo.');
                    }
                    const ligadas = transacoes
                        .filter(t => t.serieId === p.serieId)
                        .sort((a, b) => (a.data || '').localeCompare(b.data || ''));
                    const batch = db.batch();
                    const deltas = {};
                    ligadas.forEach((t, idx) => {
                        const partes = (t.data || '').split('-');
                        const ano = parseInt(partes[0]); const mes = parseInt(partes[1]) - 1;
                        const ultimoDia = new Date(ano, mes + 1, 0).getDate();
                        const dia = Math.min(diaV, ultimoDia);
                        const novaData = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                        const vParc = (idx === 0 && valorEntrada != null) ? valorEntrada : valorParcela;
                        // Ajusta o saldo das parcelas já pagas, se o valor mudou
                        if (t.pago && t.contaId && vParc !== t.valor) {
                            const dif = vParc - t.valor;
                            const d = t.tipo === 'receita' ? dif : -dif;
                            deltas[t.contaId] = (deltas[t.contaId] || 0) + d;
                        }
                        batch.update(db.collection(prefixo() + 'transacoes').doc(t.id), {
                            descricao: `${f.descricao} (${idx + 1}/${numParcelas})`,
                            valor: vParc,
                            categoria,
                            data: novaData
                        });
                    });
                    Object.entries(deltas).forEach(([cId, delta]) => {
                        const conta = contas.find(c => c.id === cId);
                        if (conta) batch.update(db.collection(prefixo() + 'contas').doc(cId), { saldo: inc(delta) });
                    });
                    batch.update(db.collection(prefixo() + 'parcelas').doc(p.id), {
                        descricao: f.descricao, valorTotal, numParcelas, valorParcela, valorEntrada, diaVencimento: diaV, categoria, contaId
                    });
                    await batch.commit();
                } else {
                    // Parcela normal (contador na aba Parcelas) — não mexe em saldo já lançado
                    const parcelasPagas = Math.min(p.parcelasPagas || 0, numParcelas);
                    await db.collection(prefixo() + 'parcelas').doc(p.id).update({
                        descricao: f.descricao, valorTotal, numParcelas, valorParcela, valorEntrada, diaVencimento: diaV, categoria, contaId, parcelasPagas
                    });
                }
                cancelarEdicaoParcela();

            // Auth functions (Firebase Authentication)
            const fazerLogin = async () => {

                        setErroLogin('Sem conexão. Verifique sua internet.');

                        setErroLogin('Muitas tentativas. Aguarde um momento e tente de novo.');

                        setErroLogin('Senha incorreta ou conta ainda não criada no Firebase.');

                } catch (e) {
                    if (e.code === 'auth/invalid-email') setErroLogin('O e-mail configurado no app (EMAIL_LOGIN) é inválido.');
                    else if (e.code === 'auth/user-not-found') setErroLogin('Não há conta com esse e-mail no Firebase.');
                    else if (e.code === 'auth/network-request-failed') setErroLogin('Sem conexão. Verifique sua internet.');
                    else setErroLogin('Não foi possível enviar o link agora. Tente novamente mais tarde.');
                }

            // Abre o lembrete automaticamente 1x por dia, se houver algo a pagar

            // Avisos rápidos (toasts)
            const avisoTimerRef = useRef(null);
            const mostrarAviso = (mensagem, tipo = 'info', duracao = 4000) => {
                setAviso({ mensagem, tipo });
                if (avisoTimerRef.current) clearTimeout(avisoTimerRef.current);
                avisoTimerRef.current = setTimeout(() => setAviso(null), duracao);
            };

            // ===== Calculadora =====
            const calcNumToStr = (n) => {
                if (!isFinite(n)) return 'Erro';
                let s = (Math.round((n + Number.EPSILON) * 1e10) / 1e10).toString();
                if (s.indexOf('e') >= 0 || s.indexOf('E') >= 0) {
                    s = n.toFixed(10).replace(/\.?0+$/, '');
                }
                return s;
            };
            const calcAplicar = (a, b, op) => {
                switch (op) {
                    case '+': return a + b;
                    case '-': return a - b;
                    case '*': return a * b;
                    case '/': return b === 0 ? Infinity : a / b;
                    default: return b;
                }
            };
            const calcSimbolo = (op) => op === '*' ? '×' : op === '/' ? '÷' : op === '-' ? '−' : '+';
            const calcFmt = (s) => {
                if (s === 'Erro') return 'Erro';
                if (s === undefined || s === null) s = '0';
                s = String(s);
                let neg = s.charAt(0) === '-';
                if (neg) s = s.slice(1);
                let partes = s.split('.');
                let inteiro = partes[0].replace(/^0+(?=\d)/, '');
                if (inteiro === '') inteiro = '0';
                inteiro = inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                let out = inteiro;
                if (partes.length > 1) out += ',' + partes[1];
                return (neg ? '-' : '') + out;
            };
            const calcLimpar = () => {
                setCalcDisplay('0'); setCalcPrev(null); setCalcOp(null); setCalcOverwrite(true); setCalcHist('');
            };
            const calcDigito = (d) => {
                if (calcDisplay === 'Erro' || calcOverwrite) { setCalcDisplay(d === '.' ? '0.' : d); setCalcOverwrite(false); return; }
                if (d === '.') { if (!calcDisplay.includes('.')) setCalcDisplay(calcDisplay + '.'); return; }
                if (calcDisplay === '0') { setCalcDisplay(d); return; }
                if (calcDisplay === '-0') { setCalcDisplay('-' + d); return; }
                if (calcDisplay.replace('-', '').replace('.', '').length >= 12) return;
                setCalcDisplay(calcDisplay + d);
            };
            const calcOperador = (op) => {
                if (calcDisplay === 'Erro') return;
                const atual = parseFloat(calcDisplay);
                if (isNaN(atual)) return;
                if (calcOp !== null && calcPrev !== null && !calcOverwrite) {
                    const r = calcAplicar(calcPrev, atual, calcOp);
                    const rs = calcNumToStr(r);
                    if (rs === 'Erro') { setCalcDisplay('Erro'); setCalcPrev(null); setCalcOp(null); setCalcHist(''); setCalcOverwrite(true); return; }
                    setCalcPrev(r);
                    setCalcDisplay(rs);
                    setCalcHist(calcFmt(rs) + ' ' + calcSimbolo(op));
                } else {
                    setCalcPrev(atual);
                    setCalcHist(calcFmt(calcDisplay) + ' ' + calcSimbolo(op));
                }
                setCalcOp(op);
                setCalcOverwrite(true);
            };
            const calcIgual = () => {
                if (calcOp === null || calcPrev === null || calcDisplay === 'Erro') return;
                const atual = parseFloat(calcDisplay);
                if (isNaN(atual)) return;
                const r = calcAplicar(calcPrev, atual, calcOp);
                const rs = calcNumToStr(r);
                const linha = calcFmt(calcNumToStr(calcPrev)) + ' ' + calcSimbolo(calcOp) + ' ' + calcFmt(calcDisplay) + ' =';
                setCalcHist(rs === 'Erro' ? '' : linha);
                setCalcDisplay(rs);
                setCalcPrev(null);
                setCalcOp(null);
                setCalcOverwrite(true);
            };
            const calcPorcento = () => {
                if (calcDisplay === 'Erro') return;
                const atual = parseFloat(calcDisplay);
                if (isNaN(atual)) return;
                const r = (calcOp !== null && calcPrev !== null) ? (calcPrev * atual / 100) : (atual / 100);
                setCalcDisplay(calcNumToStr(r));
                setCalcOverwrite(false);
            };
            const calcSinal = () => {
                if (calcDisplay === 'Erro' || calcDisplay === '0') return;
                setCalcDisplay(calcDisplay.charAt(0) === '-' ? calcDisplay.slice(1) : '-' + calcDisplay);
            };
            const calcApagar = () => {
                if (calcDisplay === 'Erro') { calcLimpar(); return; }
                if (calcOverwrite) return;
                let s = calcDisplay;
                if (s.length <= 1 || (s.length === 2 && s.charAt(0) === '-')) { setCalcDisplay('0'); return; }
                setCalcDisplay(s.slice(0, -1));
            };
            const calcCopiar = () => {
                if (calcDisplay === 'Erro') { mostrarAviso('Nada para copiar', 'erro'); return; }
                const txt = calcDisplay.replace('.', ',');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(
                        () => mostrarAviso('Copiado: ' + txt, 'ok'),
                        () => mostrarAviso('Não consegui copiar', 'erro')
                    );
                } else {
                    mostrarAviso('Cópia não suportada neste navegador', 'erro');

            };

            // Estado da conexão (online/offline)
            useEffect(() => {
                const ficouOnline = () => { setOnline(true); mostrarAviso('Conexão restabelecida. Sincronizando…', 'ok'); };
                const ficouOffline = () => { setOnline(false); mostrarAviso('Você está offline. Suas alterações serão salvas e sincronizadas quando a internet voltar.', 'info', 6000); };
                window.addEventListener('online', ficouOnline);
                window.addEventListener('offline', ficouOffline);
                return () => {
                    window.removeEventListener('online', ficouOnline);
                    window.removeEventListener('offline', ficouOffline);

            // Avisa quando uma gravação realmente falha (em vez de falhar em silêncio)
            useEffect(() => {

                        } else if (e.code === 'unavailable' || e.code === 'failed-precondition') {

                        } else {

            // Papel de parede: envia uma foto, comprime e guarda (pra não pesar)
            const aoEscolherPapel = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const max = 1280;
                        let { width, height } = img;
                        if (width > max || height > max) {
                            const r = Math.min(max / width, max / height);
                            width = Math.round(width * r);
                            height = Math.round(height * r);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        try {
                            localStorage.setItem('fin-papel', dataUrl);
                            setPapelParede(dataUrl);
                        } catch (err) {
                            alert('A imagem ficou grande demais para salvar. Tente uma foto menor.');

                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            // Backup / Exportar / Restaurar
            const baixarArquivo = (conteudo, nomeArquivo, tipo) => {

            const exportarJSON = () => {
                const dados = { versao: 5, exportadoEm: new Date().toISOString(), transacoes, contas, parcelas, investimentos, extras, categorias: categoriasCustomDocs, investValores: valoresInvDocs, orcamentos: orcamentosDocs };
                baixarArquivo(JSON.stringify(dados, null, 2), `financeiro-backup-${getDataHoje()}.json`, 'application/json');

            const exportarCSV = () => {
                const nomeConta = (id) => { const c = contas.find(c => c.id === id); return c ? c.nome : ''; };
                const esc = (v) => {
                    const s = String(v == null ? '' : v);
                    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
                };
                const cabecalho = ['Data', 'Tipo', 'Descrição', 'Categoria', 'Valor', 'Pago', 'Conta'];
                const linhas = transacoes.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(t =>
                    [t.data, t.tipo, t.descricao, t.categoria, String(t.valor).replace('.', ','), t.pago ? 'Sim' : 'Não', nomeConta(t.contaId)].map(esc).join(';')

                const csv = '\uFEFF' + [cabecalho.join(';'), ...linhas].join('\n');

            const exportarExcel = () => {
                if (typeof XLSX === 'undefined') {
                    alert('A planilha do Excel precisa de internet para carregar na primeira vez. Conecte-se e tente de novo.');
                    return;
                }
                const nomeConta = (id) => { const c = contas.find(c => c.id === id); return c ? c.nome : ''; };
                const wb = XLSX.utils.book_new();
                const addAba = (nome, linhas) => {
                    const ws = XLSX.utils.json_to_sheet(linhas.length ? linhas : [{}]);
                    XLSX.utils.book_append_sheet(wb, ws, nome);
                };
                addAba('Transacoes', transacoes.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(t => ({
                    Data: t.data || '', Tipo: t.tipo, 'Descrição': t.descricao, Categoria: t.categoria,

                })));
                addAba('Contas', contas.map(c => ({ Nome: c.nome, Tipo: c.tipo, Saldo: c.saldo })));
                addAba('Parcelas', parcelas.map(p => ({
                    'Descrição': p.descricao, 'Valor total': p.valorTotal, 'Nº parcelas': p.numParcelas,
                    'Entrada (1ª)': p.valorEntrada != null ? p.valorEntrada : '', 'Valor da parcela': p.valorParcela, 'Pagas': parcelasPagasDe(p), 'Dia venc.': p.diaVencimento,
                    Categoria: p.categoria, Conta: nomeConta(p.contaId), 'Em Finanças': p.lancadoFinancas ? 'Sim' : 'Não'
                })));
                addAba('Investimentos', investimentos.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(i => ({
                    Data: i.data || '', Tipo: i.tipo, 'Descrição': i.descricao, Categoria: i.categoria,
                    Valor: i.valor, Conta: nomeConta(i.contaId)
                })));
                addAba('Extras', extras.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(e => ({
                    Data: e.data || '', Tipo: e.tipo === 'receita' ? 'Receita' : 'Despesa', Categoria: e.categoria, 'Descrição': e.descricao || '',

                addAba('Rendimento', investPorTipo.map(t => ({

                    Rendimento: t.rendimento != null ? t.rendimento : '',
                    'Rendimento %': t.rendPct != null ? Number(t.rendPct.toFixed(2)) : ''

                })).concat(rendaBase ? [{ Categoria: 'Renda base (projeção)', 'Limite mensal': rendaBase, 'Gasto no mês atual': '' }] : []));
                XLSX.writeFile(wb, `financeiro-completo-${getDataHoje()}.xlsx`);

                reader.onload = async (ev) => {
                    let dados;
                    try { dados = JSON.parse(ev.target.result); } catch (err) { alert('Arquivo inválido.'); return; }
                    if (!dados || (!dados.transacoes && !dados.contas && !dados.parcelas && !dados.investimentos && !dados.extras && !dados.categorias && !dados.investValores && !dados.orcamentos)) {
                        alert('Este arquivo não parece um backup do Financeiro.');
                        return;
                    }
                    const total = (dados.transacoes?.length || 0) + (dados.contas?.length || 0) + (dados.parcelas?.length || 0) + (dados.investimentos?.length || 0) + (dados.extras?.length || 0) + (dados.categorias?.length || 0) + (dados.orcamentos?.length || 0) + (dados.investValores?.length || 0);
                    if (!confirm(`Restaurar este backup? Ele tem ${total} item(ns).\n\nOs itens do backup serão gravados (itens com o mesmo identificador são sobrescritos). Isto NÃO apaga lançamentos criados depois.`)) return;

                        const restaurar = async (nome, lista) => {
                            if (!Array.isArray(lista)) return;
                            for (let i = 0; i < lista.length; i += 400) {
                                const batch = db.batch();
                                lista.slice(i, i + 400).forEach(item => {
                                    const { id, ...resto } = item;
                                    const ref = id ? db.collection(prefixo() + nome).doc(id) : db.collection(prefixo() + nome).doc();
                                    batch.set(ref, resto);
                                });
                                await batch.commit();
                            }
                        };
                        await restaurar('transacoes', dados.transacoes);
                        await restaurar('contas', dados.contas);
                        await restaurar('parcelas', dados.parcelas);
                        await restaurar('investimentos', dados.investimentos);
                        await restaurar('extras', dados.extras);
                        await restaurar('categorias', dados.categorias);
                        await restaurar('investValores', dados.investValores);
                        await restaurar('orcamentos', dados.orcamentos);
                        alert('✅ Backup restaurado com sucesso!');
                        setMostrarBackup(false);

                        alert('Erro ao restaurar: ' + (err.message || err));
                    }

                    }

                                        <button onClick={() => calcOperador('+')} className={`${calcBtnOp} ${(calcOp === '+' && calcOverwrite) ? 'ring-2 ring-inset ring-white' : ''}`}>+</button>

                                        <button onClick={calcSinal} className={calcBtnFn}>±</button>
                                        <button onClick={() => calcDigito('0')} className={calcBtnNum}>0</button>
                                        <button onClick={() => calcDigito('.')} className={calcBtnNum}>,</button>
                                        <button onClick={calcIgual} className="py-3.5 rounded-xl text-lg font-bold text-white active:scale-95 transition-transform select-none bg-green-600 hover:bg-green-700">=</button>
                                    </div>

                                    <button onClick={calcCopiar} className="w-full mt-3 py-2.5 rounded-xl text-sm font-bold bg-purple-600 text-white hover:bg-purple-700 active:scale-95 transition-transform">📋 Copiar resultado</button>
                                    <p className="text-center text-xs text-gray-400 mt-2">Copie o resultado para colar em qualquer valor do app.</p>
                                </div>
                            </div>
                        )}

                        {/* Aviso (toast) */}
                        {aviso && (
                            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white max-w-xs text-center"
                                style={{ backgroundColor: aviso.tipo === 'erro' ? '#dc2626' : aviso.tipo === 'ok' ? '#16a34a' : '#334155' }}>
                                {aviso.mensagem}
                            </div>
                        )}

                        {/* Modal: backup / exportar */}
                        {mostrarBackup && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className={`${cardClass} rounded-2xl p-5 w-full max-w-sm shadow-2xl max-h-[85vh] overflow-y-auto`}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-lg font-bold">💾 Backup / Exportar</h3>
                                        <button onClick={() => setMostrarBackup(false)}><Icon name="x" /></button>
                                    </div>

                                    <p className="text-sm font-bold mb-2">Salvar uma cópia</p>
                                    <button onClick={exportarJSON} className="w-full mb-2 py-3 bg-purple-600 text-white rounded-lg font-medium text-left px-4">
                                        🗂️ Backup completo (.json)
                                        <span className="block text-xs font-normal opacity-80">Tudo (transações, contas, parcelas, investimentos, extras e categorias). É este que restaura o app — guarde num lugar seguro.</span>
                                    </button>
                                    <button onClick={exportarExcel} className="w-full mb-2 py-3 bg-emerald-600 text-white rounded-lg font-medium text-left px-4">
                                        📗 Planilha Excel completa (.xlsx)
                                        <span className="block text-xs font-normal opacity-80">Tudo em abas separadas, para abrir no Excel/Planilhas e guardar. (Não restaura no app — para isso use o .json.)</span>
                                    </button>
                                    <button onClick={exportarCSV} className="w-full mb-4 py-3 bg-green-600 text-white rounded-lg font-medium text-left px-4">
                                        📊 Transações (.csv para Excel)
                                        <span className="block text-xs font-normal opacity-80">Abre no Excel/Planilhas para você analisar.</span>
                                    </button>

                                    <div className={`my-2 border-t ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}></div>

                                    <p className="text-sm font-bold mb-2">Restaurar</p>
                                    <label className="w-full block py-3 bg-blue-600 text-white rounded-lg font-medium text-left px-4 cursor-pointer">
                                        ♻️ Restaurar de um backup (.json)
                                        <span className="block text-xs font-normal opacity-80">Carrega um arquivo de backup. Itens iguais são sobrescritos; nada é apagado.</span>
                                        <input type="file" accept="application/json,.json" onChange={importarJSON} className="hidden" />
                                    </label>

                                    <p className={`text-xs mt-3 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                        Dica: guarde o arquivo .json num lugar seguro (e-mail, Google Drive). É a sua garantia caso algo aconteça.
                                    </p>

                                    <button onClick={() => setMostrarBackup(false)} className="w-full mt-4 py-2 bg-gray-200 text-gray-700 rounded-lg">Fechar</button>
                                </div>
                            </div>
                        )}

                        {/* Modal: personalizar */}
                        {mostrarPersonalizar && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className={`${cardClass} rounded-2xl p-5 w-full max-w-sm shadow-2xl max-h-[85vh] overflow-y-auto`}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-lg font-bold">🎨 Personalizar</h3>
                                        <button onClick={() => setMostrarPersonalizar(false)}><Icon name="x" /></button>
                                    </div>

                                    <p className="text-sm font-bold mb-2">Cor de destaque</p>
                                    <div className="flex flex-wrap gap-2 mb-3">
                                        {['#7c3aed','#2563eb','#0891b2','#059669','#16a34a','#ca8a04','#ea580c','#dc2626','#db2777','#4f46e5'].map(c => (
                                            <button key={c} onClick={() => setCorPrimaria(c)}
                                                className={`w-8 h-8 rounded-full border-2 ${corPrimaria.toLowerCase() === c ? 'ring-2 ring-offset-2 ring-gray-400 border-white' : 'border-transparent'}`}
                                                style={{backgroundColor: c}} title={c}></button>
                                        ))}
                                    </div>
                                    <label className="flex items-center gap-2 text-sm mb-5">
                                        <span>Cor personalizada:</span>
                                        <input type="color" value={corPrimaria} onChange={(e) => setCorPrimaria(e.target.value)}
                                            className="w-10 h-8 rounded cursor-pointer bg-transparent" />
                                    </label>

                                    <p className="text-sm font-bold mb-2">Papel de parede</p>
                                    {papelParede ? (
                                        <div className="h-24 rounded-xl bg-cover bg-center mb-2 border border-gray-300" style={{backgroundImage: `url("${papelParede}")`}}></div>
                                    ) : (
                                        <p className="text-xs text-gray-500 mb-2">Nenhum papel de parede.</p>
                                    )}
                                    <div className="flex gap-2 mb-5">
                                        <label className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-center text-sm font-medium cursor-pointer">
                                            📷 Escolher foto
                                            <input type="file" accept="image/*" onChange={aoEscolherPapel} className="hidden" />
                                        </label>
                                        {papelParede && <button onClick={removerPapel} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm">Remover</button>}
                                    </div>

                                    <div className={`my-4 border-t ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}></div>
                                    <p className="text-sm font-bold mb-2">🏷️ Categorias personalizadas</p>
                                    <div className="flex gap-2 mb-2">
                                        <input type="text" placeholder="Nova categoria" value={novaCategoria}
                                            onChange={(e) => setNovaCategoria(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && executar(adicionarCategoria)}
                                            className={`flex-1 px-3 py-2 rounded-lg border-2 ${inputClass}`} />
                                        <button onClick={() => executar(adicionarCategoria)} disabled={salvando} className="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm disabled:opacity-60">Adicionar</button>
                                    </div>
                                    {categoriasCustomDocs.length === 0 ? (
                                        <p className="text-xs text-gray-500 mb-5">Você ainda não criou categorias próprias. As categorias padrão continuam disponíveis.</p>
                                    ) : (
                                        <div className="flex flex-wrap gap-2 mb-5">
                                            {categoriasCustomDocs.map(c => (
                                                <span key={c.id} className={`inline-flex items-center gap-1.5 pl-2 pr-1 py-1 rounded-lg text-sm ${darkMode ? 'bg-gray-700' : 'bg-gray-100'}`}>
                                                    <span className="w-2.5 h-2.5 rounded-full" style={{backgroundColor: corCategoria(c.nome)}}></span>
                                                    {c.nome}
                                                    <button onClick={() => removerCategoria(c.id)} className="text-red-500 px-1" title="Remover">✕</button>
                                                </span>
                                            ))}
                                        </div>
                                    )}

                                    <div className="flex gap-2">
                                        <button onClick={restaurarPadrao} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm">Restaurar padrão</button>
                                        <button onClick={() => setMostrarPersonalizar(false)} className="flex-1 py-2 bg-purple-600 text-white rounded-lg font-bold">Pronto</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal: lembrete de contas a pagar */}
                        {mostrarLembrete && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className={`${cardClass} rounded-2xl p-5 w-full max-w-sm shadow-2xl max-h-[80vh] overflow-y-auto`}>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-lg font-bold">🔔 Contas a pagar</h3>
                                        <button onClick={() => setMostrarLembrete(false)}><Icon name="x" /></button>
                                    </div>

                                    {vencidas.length === 0 && venceHoje.length === 0 ? (
                                        <p className="text-center text-gray-500 py-6">Nada vencendo agora. 🎉</p>
                                    ) : (
                                        <>
                                            {vencidas.length > 0 && (
                                                <div className="mb-4">
                                                    <p className="text-sm font-bold text-red-600 mb-2">⚠️ Atrasadas — {formatarMoeda(totalVencidas)}</p>
                                                    <div className="space-y-1">
                                                        {vencidas.map(t => (
                                                            <div key={t.id} className={`flex justify-between items-center text-sm p-2 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-red-50'}`}>
                                                                <span>{t.descricao} <span className="text-xs text-gray-500">{formatarData(t.data)}</span></span>
                                                                <span className="font-bold text-red-600 whitespace-nowrap">{formatarMoeda(t.valor)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                            {venceHoje.length > 0 && (
                                                <div className="mb-4">
                                                    <p className="text-sm font-bold text-orange-600 mb-2">📆 Vence hoje — {formatarMoeda(totalVenceHoje)}</p>
                                                    <div className="space-y-1">
                                                        {venceHoje.map(t => (
                                                            <div key={t.id} className={`flex justify-between items-center text-sm p-2 rounded-lg ${darkMode ? 'bg-gray-700' : 'bg-orange-50'}`}>
                                                                <span>{t.descricao}</span>
                                                                <span className="font-bold text-orange-600 whitespace-nowrap">{formatarMoeda(t.valor)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}

                                    <div className="flex gap-2 pt-1">
                                        <button onClick={() => setMostrarLembrete(false)} className="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg">Fechar</button>
                                        <button onClick={() => { setMostrarLembrete(false); setActiveTab('financas'); }} className="flex-1 py-2 bg-purple-600 text-white rounded-lg font-bold">Ver em Finanças</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
